<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Project Inquiry</title></head>
<body>
  <form name="project-inquiry" method="post" action="/__inquiry-received" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="project-inquiry">
    <input name="bot-field">
    <input name="name" type="text">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input name="company" type="text">
    <select name="service"></select>
    <select name="budget"></select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
